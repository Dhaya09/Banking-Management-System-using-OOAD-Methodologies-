<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — BMS Banking</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<style>
  body { background: linear-gradient(135deg, #1E3A8A 0%, #1e2f6a 40%, #0f1f4f 100%); min-height: 100vh; display: grid; place-items: center; }
  .login-wrapper { width: 100%; max-width: 420px; padding: 20px; }
  .login-card { background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
  .login-header { background: linear-gradient(135deg, #1E3A8A, #2563EB); padding: 32px 36px 28px; text-align: center; }
  .login-header .logo { font-size: 2.5rem; margin-bottom: 8px; }
  .login-header h1 { color: #fff; font-size: 1.5rem; margin-bottom: 4px; }
  .login-header p { color: rgba(255,255,255,0.65); font-size: 0.82rem; }
  .login-body { padding: 32px 36px; }
  .login-body .form-control { padding: 12px 14px; }
  .login-footer { background: #F8FAFF; padding: 16px 36px; text-align: center; border-top: 1px solid #E2E8F0; }
  .login-footer p { font-size: 0.82rem; color: #64748B; }
  .credentials-hint { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.78rem; color: #1E40AF; }
  .credentials-hint strong { display: block; margin-bottom: 6px; }
  .credentials-hint span { display: block; line-height: 1.8; }
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🏦</div>
      <h1>BMS Banking</h1>
      <p>Banking Management System</p>
    </div>
    <div class="login-body">

      <div th:if="${error}" class="alert alert-danger">
        ⚠️ <span th:text="${error}">Error</span>
      </div>
      <div th:if="${message}" class="alert alert-success">
        ✅ <span th:text="${message}">Message</span>
      </div>
      <div th:if="${success}" class="alert alert-success">
        ✅ <span th:text="${success}">Success</span>
      </div>

      <div class="credentials-hint">
        <strong>🔑 Demo Credentials</strong>
        <span>Admin: admin@bms.com / admin123</span>
        <span>Manager: manager@bms.com / manager123</span>
        <span>Staff: staff@bms.com / staff123</span>
        <span>Customer: customer@bms.com / customer123</span>
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="username" class="form-control" placeholder="Enter your email" required autofocus/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required/>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px;">
          🔐 Sign In
        </button>
      </form>
    </div>
    <div class="login-footer">
      <p>New customer? <a th:href="@{/register}">Register here</a></p>
    </div>
  </div>
</div>
</body>
</html>
