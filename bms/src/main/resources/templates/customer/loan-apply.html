<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apply for Loan — BMS Banking</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments :: header('Apply for Loan','BMS / Customer / Loans / Apply')}"></div>
    <div class="content-area">
      <div style="margin-bottom:16px;"><a th:href="@{/customer/loans}" class="btn btn-outline btn-sm">← Back</a></div>

      <div style="display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start;">

        <div class="card">
          <div class="card-header"><h4>🏛️ Loan Application Form</h4></div>
          <div class="card-body">
            <div th:if="${error}" class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>
            <form th:action="@{/customer/loans/apply}" th:object="${loanApplicationDto}" method="post" id="loanForm">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Loan Type *</label>
                  <select th:field="*{loanType}" class="form-control" required onchange="updateRate(this)">
                    <option value="">-- Select Loan Type --</option>
                    <option value="HOME">🏠 Home Loan</option>
                    <option value="CAR">🚗 Car Loan</option>
                    <option value="PERSONAL">👤 Personal Loan</option>
                    <option value="EDUCATION">🎓 Education Loan</option>
                    <option value="BUSINESS">💼 Business Loan</option>
                  </select>
                  <div class="field-error" th:if="${#fields.hasErrors('loanType')}" th:errors="*{loanType}"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">Loan Amount (₹) *</label>
                  <input type="number" th:field="*{loanAmount}" class="form-control" min="1000" step="100" placeholder="e.g. 500000" oninput="calcEMI()"/>
                  <div class="field-error" th:if="${#fields.hasErrors('loanAmount')}" th:errors="*{loanAmount}"></div>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Interest Rate (% per annum) *</label>
                  <input type="number" th:field="*{interestRate}" id="interestRate" class="form-control" min="1" max="30" step="0.1" placeholder="e.g. 8.5" oninput="calcEMI()"/>
                  <div class="field-error" th:if="${#fields.hasErrors('interestRate')}" th:errors="*{interestRate}"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">Duration (Months) *</label>
                  <input type="number" th:field="*{durationMonths}" class="form-control" min="1" max="360" placeholder="e.g. 60" oninput="calcEMI()"/>
                  <div class="field-error" th:if="${#fields.hasErrors('durationMonths')}" th:errors="*{durationMonths}"></div>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Purpose *</label>
                <input type="text" th:field="*{purpose}" class="form-control" placeholder="Describe the purpose of this loan"/>
                <div class="field-error" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></div>
              </div>
              <button type="submit" class="btn btn-primary btn-full btn-lg">📤 Submit Loan Application</button>
            </form>
          </div>
        </div>

        <!-- EMI Calculator -->
        <div class="card">
          <div class="card-header"><h4>🧮 EMI Calculator</h4></div>
          <div class="card-body">
            <div style="text-align:center;padding:12px 0;">
              <div style="font-size:0.8rem;color:#64748B;">Monthly EMI</div>
              <div id="emiAmount" style="font-size:2.2rem;font-weight:700;color:#1E3A8A;font-family:'Space Grotesk',sans-serif;">₹0</div>
            </div>
            <hr style="border-color:#E2E8F0;margin:16px 0;"/>
            <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
              <span style="font-size:0.82rem;color:#64748B;">Principal</span>
              <span id="principal" style="font-weight:600;font-size:0.85rem;">₹0</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
              <span style="font-size:0.82rem;color:#64748B;">Total Interest</span>
              <span id="totalInterest" style="font-weight:600;font-size:0.85rem;color:#EF4444;">₹0</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #E2E8F0;">
              <span style="font-size:0.85rem;font-weight:600;">Total Payable</span>
              <span id="totalPayable" style="font-weight:700;font-size:0.9rem;color:#1E3A8A;">₹0</span>
            </div>
            <div style="margin-top:16px;padding:10px;background:#EFF6FF;border-radius:8px;font-size:0.75rem;color:#1E40AF;">
              💡 EMI calculated using standard formula: P·r·(1+r)^n / ((1+r)^n - 1)
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
const rates = { HOME:8.5, CAR:9.0, PERSONAL:12.0, EDUCATION:7.5, BUSINESS:11.0 };

function updateRate(sel) {
  const r = rates[sel.value];
  if (r) { document.getElementById('interestRate').value = r; calcEMI(); }
}

function calcEMI() {
  const form = document.getElementById('loanForm');
  const P = parseFloat(form.querySelector('[name="loanAmount"]').value) || 0;
  const annual = parseFloat(form.querySelector('[name="interestRate"]').value) || 0;
  const n = parseInt(form.querySelector('[name="durationMonths"]').value) || 0;
  const r = annual / (12 * 100);

  let emi = 0;
  if (P > 0 && n > 0) {
    if (r === 0) emi = P / n;
    else emi = P * r * Math.pow(1+r,n) / (Math.pow(1+r,n) - 1);
  }

  const total = emi * n;
  const interest = total - P;
  const fmt = v => '₹' + v.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});

  document.getElementById('emiAmount').textContent = fmt(emi);
  document.getElementById('principal').textContent = fmt(P);
  document.getElementById('totalInterest').textContent = fmt(Math.max(0,interest));
  document.getElementById('totalPayable').textContent = fmt(total);
}
</script>
</body>
</html>
