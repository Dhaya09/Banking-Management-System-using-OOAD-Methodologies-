<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Manager Dashboard — BMS Banking</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments :: header('Manager Dashboard','BMS / Manager / Dashboard')}"></div>
    <div class="content-area">

      <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon orange">⏳</div>
          <div class="stat-info"><div class="stat-label">Pending Loans</div><div class="stat-value" th:text="${pendingCount}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon cyan">🔍</div>
          <div class="stat-info"><div class="stat-label">Under Review</div><div class="stat-value" th:text="${underReviewCount}">0</div></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">

        <div class="card">
          <div class="card-header">
            <h4>⏳ Pending Loan Applications</h4>
            <a th:href="@{/manager/loans}" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div th:if="${pendingLoans.empty}" class="empty-state" style="padding:30px;">
            <div class="empty-icon" style="font-size:2rem;">✅</div>
            <p>No pending loans</p>
          </div>
          <div class="table-wrapper" th:unless="${pendingLoans.empty}">
            <table>
              <thead><tr><th>Reference</th><th>Customer</th><th>Amount</th><th>Type</th><th>Action</th></tr></thead>
              <tbody>
                <tr th:each="loan : ${pendingLoans}">
                  <td style="font-family:monospace;font-size:0.75rem;" th:text="${loan.loanReference}">REF</td>
                  <td th:text="${loan.customer.name}">Customer</td>
                  <td class="fw-600" th:text="'₹' + ${#numbers.formatDecimal(loan.loanAmount,1,'COMMA',0,'POINT')}">₹0</td>
                  <td th:text="${loan.loanType}">HOME</td>
                  <td><a th:href="@{/manager/loans/{id}(id=${loan.loanId})}" class="btn btn-primary btn-sm">Review</a></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h4>📋 Recent Loans</h4>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Ref</th><th>Customer</th><th>Status</th></tr></thead>
              <tbody>
                <tr th:each="loan : ${allLoans}">
                  <td style="font-family:monospace;font-size:0.75rem;" th:text="${loan.loanReference}">REF</td>
                  <td th:text="${loan.customer.name}">Customer</td>
                  <td>
                    <span class="badge"
                      th:classappend="${loan.status.name() == 'APPROVED' or loan.status.name() == 'DISBURSED'} ? 'badge-success' :
                                     (${loan.status.name() == 'REJECTED'} ? 'badge-danger' :
                                     (${loan.status.name() == 'UNDER_REVIEW'} ? 'badge-info' : 'badge-warning'))"
                      th:text="${loan.status}">STATUS</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

      <div style="margin-top:18px;">
        <a th:href="@{/manager/loans}" class="btn btn-primary">🏛️ Manage All Loans</a>
      </div>

    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
