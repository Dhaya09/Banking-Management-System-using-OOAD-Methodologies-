<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loan Management — BMS Banking</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments :: header('Loan Management','BMS / Manager / Loans')}"></div>
    <div class="content-area">

      <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
      <div th:if="${error}"   class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

      <div class="section-header"><h2>🏛️ All Loan Applications</h2></div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Reference</th><th>Customer</th><th>Type</th><th>Amount</th>
                <th>Rate</th><th>Duration</th><th>EMI</th><th>Applied</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="loan : ${loans}">
                <td style="font-family:monospace;font-size:0.75rem;" th:text="${loan.loanReference}">REF</td>
                <td class="fw-600" th:text="${loan.customer.name}">Customer</td>
                <td th:text="${loan.loanType}">HOME</td>
                <td class="fw-600" th:text="'₹' + ${#numbers.formatDecimal(loan.loanAmount,1,'COMMA',0,'POINT')}">₹0</td>
                <td th:text="${loan.interestRate} + '%'">8%</td>
                <td th:text="${loan.durationMonths} + 'm'">60m</td>
                <td th:text="'₹' + ${#numbers.formatDecimal(loan.calculateEMI(),1,'COMMA',0,'POINT')}">₹0</td>
                <td th:text="${#temporals.format(loan.appliedDate,'dd MMM yy')}">Date</td>
                <td>
                  <span class="badge"
                    th:classappend="${loan.status.name() == 'APPROVED' or loan.status.name() == 'DISBURSED'} ? 'badge-success' :
                                   (${loan.status.name() == 'REJECTED'} ? 'badge-danger' :
                                   (${loan.status.name() == 'UNDER_REVIEW'} ? 'badge-info' : 'badge-warning'))"
                    th:text="${loan.status}">STATUS</span>
                </td>
                <td>
                  <a th:href="@{/manager/loans/{id}(id=${loan.loanId})}" class="btn btn-primary btn-sm">Review</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
