<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard — BMS Banking</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments :: header('Admin Dashboard','BMS / Admin / Dashboard')}"></div>
    <div class="content-area">

      <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue">👥</div>
          <div class="stat-info"><div class="stat-label">Total Users</div><div class="stat-value" th:text="${totalUsers}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">💳</div>
          <div class="stat-info"><div class="stat-label">Total Accounts</div><div class="stat-value" th:text="${totalAccounts}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">🏛️</div>
          <div class="stat-info"><div class="stat-label">Total Loans</div><div class="stat-value" th:text="${totalLoans}">0</div></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">

        <div class="card">
          <div class="card-header">
            <h4>👥 Recent Users</h4>
            <a th:href="@{/admin/users}" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead>
              <tbody>
                <tr th:each="u : ${recentUsers}">
                  <td th:text="${u.name}">Name</td>
                  <td style="font-size:0.78rem;" th:text="${u.email}">email</td>
                  <td><span class="badge badge-info" th:text="${u.role}">ROLE</span></td>
                  <td>
                    <span class="badge" th:classappend="${u.active} ? 'badge-success' : 'badge-danger'"
                          th:text="${u.active} ? 'Active' : 'Inactive'">Active</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h4>💳 Recent Accounts</h4>
            <a th:href="@{/admin/accounts}" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Account No.</th><th>Type</th><th>Balance</th><th>Status</th></tr></thead>
              <tbody>
                <tr th:each="acc : ${recentAccounts}">
                  <td style="font-size:0.78rem;font-family:monospace;" th:text="${acc.accountNumber}">ACC</td>
                  <td th:text="${acc.accountType}">SAVINGS</td>
                  <td class="fw-600" th:text="'₹' + ${#numbers.formatDecimal(acc.balance,1,'COMMA',2,'POINT')}">₹0</td>
                  <td>
                    <span class="badge" th:classappend="${acc.status.name() == 'ACTIVE'} ? 'badge-success' : 'badge-warning'"
                          th:text="${acc.status}">ACTIVE</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

      <div style="margin-top:22px;display:flex;gap:12px;">
        <a th:href="@{/admin/users/new}" class="btn btn-primary">👤 Add New User</a>
        <a th:href="@{/admin/users}" class="btn btn-outline">👥 Manage Users</a>
        <a th:href="@{/admin/accounts}" class="btn btn-outline">💳 Manage Accounts</a>
        <a th:href="@{/admin/loans}" class="btn btn-outline">🏛️ View All Loans</a>
      </div>

    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
