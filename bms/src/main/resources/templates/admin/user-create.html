<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Add User — BMS Banking</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments :: header('Add New User','BMS / Admin / Users / New')}"></div>
    <div class="content-area">
      <div style="margin-bottom:16px;"><a th:href="@{/admin/users}" class="btn btn-outline btn-sm">← Back</a></div>
      <div class="card" style="max-width:560px;">
        <div class="card-header"><h4>👤 Create New User</h4></div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>
          <form th:action="@{/admin/users/new}" th:object="${userCreationDto}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Full name" required/>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="user@bms.com" required/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Min 6 chars" required/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Role *</label>
                <select th:field="*{role}" class="form-control" required onchange="toggleFields(this)">
                  <option value="">-- Select Role --</option>
                  <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control" placeholder="9876543210"/>
              </div>
              <div class="form-group" id="empIdGroup">
                <label class="form-label">Employee ID</label>
                <input type="text" th:field="*{employeeId}" class="form-control" placeholder="EMP001"/>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group" id="deptGroup">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{department}" class="form-control" placeholder="Operations"/>
              </div>
              <div class="form-group" id="branchGroup">
                <label class="form-label">Branch Code</label>
                <input type="text" th:field="*{branchCode}" class="form-control" placeholder="BMS-CHN-01"/>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg">✅ Create User</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
